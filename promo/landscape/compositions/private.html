  <script>
    const tl = gsap.timeline({ paused: true });
    const PLAIN = "Wi-Fi: blue-otter-2026";
    const CIPHER = "q7Z+e1Kx9/aR0mT4wB=c2L";
    const pkt = document.getElementById("pv-pkt");
    const st = { enc: 0, dec: 0 };
    const paint = () => {
      const n = PLAIN.length;
      let s = "";
      for (let i = 0; i < n; i++) {
        const encd = i < st.enc * n;
        const decd = i < st.dec * n;
        s += encd && !decd ? CIPHER[i] : PLAIN[i];
      }
      pkt.textContent = s;
    };
    tl.fromTo("#pv-flood", { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.inOut" }, 0);
    tl.fromTo(".pv-title span", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.14, stagger: 0.07, ease: "power2.out" }, 0.12);

    tl.fromTo(".node", { scale: 0 }, { scale: 1, duration: 0.3, stagger: 0.12, ease: "back.out(1.6)" }, 0.55);
    tl.fromTo(["#pv-l1", "#pv-l3"], { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.7);
    tl.fromTo("#pv-pkt", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.8);
    // Packet travels PC -> relay -> phone; scrambles on the way out, unscrambles on arrival

    tl.fromTo(st, { enc: 0 }, { enc: 1, duration: 0.6, ease: "none" }, 1.1);
    tl.fromTo(st, { dec: 0 }, { dec: 1, duration: 0.6, ease: "none", immediateRender: false }, 2.75);
    tl.eventCallback("onUpdate", paint);
    tl.fromTo("#pv-pkt", { color: "#ecfeff" }, { color: "#5eead4", duration: 0.3 }, 1.4);
    tl.to("#pv-pkt", { color: "#ecfeff", duration: 0.3 }, 2.9);
    tl.fromTo("#pv-l2", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 1.9);
    tl.fromTo("#pv-facts", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.25, ease: "power2.out" }, 3.6);
    // "Run it on ..." — the word rolls like a slot on the beat
    tl.fromTo("#pv-run", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, 4.3);
    tl.fromTo("#pv-stack", { y: 0, filter: "blur(0px)" }, { keyframes: [{ y: -48, filter: "blur(6px)", duration: 0.1, ease: "power2.in" }, { y: -96, filter: "blur(0px)", duration: 0.12, ease: "power2.out" }] }, 5.3);

    paint();
    window.__timelines["private"] = tl;
